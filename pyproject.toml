[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bryantliak-realtimedw_jd098"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别实时数仓架构师·线上分布漂移的检测上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bryantliak" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bryantliak.github.io"
Repository = "https://github.com/bryantliak/realtimedw_jd098"
Issues = "https://github.com/bryantliak/realtimedw_jd098/issues"

[project.scripts]
realtimedw_jd098 = "realtimedw_jd098:main"

[tool.setuptools]
py-modules = ["realtimedw_jd098"]
